<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desmond's Treasure</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #ecf0f1;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(52, 73, 94, 0.8);
            border: 2px solid #3498db;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        h1 {
            color: #3498db;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .flag {
            background: #1a252f;
            border: 1px solid #34495e;
            border-radius: 5px;
            padding: 20px;
            font-size: 1.8em;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }
        .message {
            font-size: 1.2em;
            margin: 20px 0;
            line-height: 1.6;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Congratulations! 🎉</h1>
        <div class="message">
            You successfully followed Desmond's trail through the network logs!
            <br><br>
            You've discovered his secret treasure hidden at this special port.
            <br><br>
            Here is what he hid and your present: 😊
        </div>
        <div class="flag">
            SPARK{k67A_DORA_8nh2_des0}
        </div>
        <div class="footer">
            Challenge: DORA The Explorer<br>
            Creator: Edwin
        </div>
    </div>
</body>
</html>
